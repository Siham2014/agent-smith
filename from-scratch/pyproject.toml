[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution agent"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "google-genai>=1.75,<2",
    "httpx>=0.28,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_smith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
